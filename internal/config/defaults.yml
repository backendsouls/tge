# Default values for the game's entities.
#
# This file is embedded in the binary. To override it, point the TGE_DEFAULTS
# environment variable at a YAML file; only the keys you set are overridden.

# Fill-in defaults: used when a value is not provided.
world:
  reality: "The Box"
  omniverse: "Origin Omniverse"
  multiverse: "Origin Multiverse"
  universe: "Origin Universe"
  realm: "Mortal Realm"
  power_system: "Cultivation"   # the default cultivation

system_log:
  template: "[Ding! %s]"

character:
  gender: "Male"
  age: 16
  species:            # the Human base, used as the initial-status template
    name: "Human"
    power: 1
    lifespan: 80
    default_gender: "Male"
  stats:              # a new character's starting attributes
    str: 0.65
    agi: 0.65
    int: 0.65
    vit: 0.65
    dex: 0.65
    wis: 0.65
    cha: 0.65
    luk: 0.65

rpg:
  grades:
    - { name: "Common", level: 1, power_multiplier: 1.0 }
    - { name: "Uncommon", level: 2, power_multiplier: 1.2 }
    - { name: "Rare", level: 3, power_multiplier: 1.5 }
    - { name: "Epic", level: 4, power_multiplier: 2.0 }
    - { name: "Legendary", level: 5, power_multiplier: 3.0 }
    - { name: "Mythic", level: 6, power_multiplier: 5.0 }

# Starter catalog: seeded into the store on startup if absent.
catalog:
  species:
    - { name: "Human",    power: 0.65,  lifespan: 80,    default_gender: "Male" }
    - { name: "Demon",    power: 3,  lifespan: 500,   default_gender: "Male" }
    - { name: "Spirit",   power: 2,  lifespan: 1000,  default_gender: "Female" }
    - { name: "Beastkin", power: 4,  lifespan: 150,   default_gender: "Male" }
    - { name: "Dragon",   power: 10, lifespan: 10000, default_gender: "Male" }
    - { name: "Fae",      power: 2,  lifespan: 3000,  default_gender: "Female" }
    - { name: "Elf",      power: 1.5,  lifespan: 2000,  default_gender: "Female" }

  # The default cultivation "Spirit" has 9 realms, each with 9 levels. 
  # breakthrough points per level are applied to
  # the auto-generated levels via level_breakthrough_points.
  realms:
    - { name: "Spirit Gathering",   power_multiplier: 2,    power_adder: 10,      lifespan_multiplier: 1,   lifespan_adder: 80,     max_levels: 9, level_count: 9, level_breakthrough_points: 100 }
    - { name: "Spirit Condensation", power_multiplier: 5,   power_adder: 100,     lifespan_multiplier: 2,   lifespan_adder: 200,    max_levels: 9, level_count: 9, level_breakthrough_points: 300 }
    - { name: "Spirit Foundation",  power_multiplier: 10,   power_adder: 500,     lifespan_multiplier: 3,   lifespan_adder: 500,    max_levels: 9, level_count: 9, level_breakthrough_points: 600 }
    - { name: "Spirit Core",        power_multiplier: 20,   power_adder: 2000,    lifespan_multiplier: 5,   lifespan_adder: 1000,   max_levels: 9, level_count: 9, level_breakthrough_points: 1200 }
    - { name: "Nascent Spirit",     power_multiplier: 50,   power_adder: 10000,   lifespan_multiplier: 10,  lifespan_adder: 3000,   max_levels: 9, level_count: 9, level_breakthrough_points: 2500 }
    - { name: "Spirit Severing",    power_multiplier: 100,  power_adder: 50000,   lifespan_multiplier: 20,  lifespan_adder: 8000,   max_levels: 9, level_count: 9, level_breakthrough_points: 5000 }
    - { name: "Spirit Ascension",   power_multiplier: 250,  power_adder: 200000,  lifespan_multiplier: 40,  lifespan_adder: 20000,  max_levels: 9, level_count: 9, level_breakthrough_points: 10000 }
    - { name: "Spirit Tribulation", power_multiplier: 600,  power_adder: 1000000, lifespan_multiplier: 80,  lifespan_adder: 50000,  max_levels: 9, level_count: 9, level_breakthrough_points: 20000 }
    - { name: "Spirit Sovereign",   power_multiplier: 1500, power_adder: 5000000, lifespan_multiplier: 200, lifespan_adder: 150000, max_levels: 9, level_count: 9, level_breakthrough_points: 50000 }

  classes:
    - { name: "Warrior", description: "Front-line melee fighter" }
    - { name: "Mage", description: "Wields arcane power" }

  professions:
    - { name: "Blacksmith", description: "Forges weapons and armor" }
    - { name: "Alchemist", description: "Brews pills and potions" }

  items:
    - { name: "Gold", description: "Common currency", grade: "Common" }
    - { name: "Iron Sword", description: "A basic blade", grade: "Common" }
    - { name: "Spirit Herb", description: "A low-grade alchemy ingredient", grade: "Uncommon" }

  abilities:
    - { name: "Berserk", description: "Trade defense for raw power", grade: "Rare" }

  skills:
    - { name: "Parry", description: "Deflect an incoming blow", grade: "Common" }

  effects:
    - { name: "Poison", kind: "Status", description: "Damage over time" }
    - { name: "Might", kind: "Buff", description: "Increased strength" }

  equipment:
    - name: "Steel Plate"
      slot: "Armor"
      bonus: { vit: 5, str: 2 }
    - name: "Iron Sword"
      slot: "Weapon"
      bonus: { str: 3 }

  quests:
    - name: "Slay the Dragon"
      description: "Defeat the dragon terrorizing the valley"
      objectives:
        - { order: 1, description: "Find the dragon's lair" }
        - { order: 2, description: "Defeat the dragon" }

  recipes:
    - name: "Health Potion"
      output: "Spirit Herb"
      inputs:
        - { item: "Spirit Herb", quantity: 2 }
        - { item: "Gold", quantity: 1 }

  power_systems:
    - name: "Gamer (LowFantasy)"
      kind: "Gamer"
      powers:
        - name: "System Interface"
    - name: "Gamer (HighFantasy)"
      kind: "Gamer"
      powers:
        - name: "System Interface"
    - name: "Cultivation"
      kind: "Cultivation"
      powers:
        - name: "Spirit"
        - name: "Body"
        - name: "Soul"
    - name: "SuperPower"
      kind: "SuperPower"
      powers:
        - name: "Physical Enhancements"
          children:
            - { name: "Super Strength" }
            - { name: "Super Speed" }
            - { name: "Invulnerability" }
            - { name: "Enhanced Senses" }
        - name: "Mental Abilities"
          children:
            - { name: "Telepathy" }
            - { name: "Telekinesis" }
            - { name: "Precognition" }
            - { name: "Mind Control" }
        - name: "Energy Manipulation"
          children:
            - { name: "Pyrokinesis" }
            - { name: "Electrokinesis" }
            - { name: "Energy Projection" }
            - { name: "Force Fields" }
        - name: "Biological Alteration"
          children:
            - { name: "Regeneration" }
            - { name: "Shapeshifting" }
            - { name: "Invisibility" }
            - { name: "Elasticity" }
        - name: "Reality Manipulation"
          children:
            - { name: "Teleportation" }
            - { name: "Time Manipulation" }
            - { name: "Gravity Control" }
