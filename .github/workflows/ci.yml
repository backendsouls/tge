name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.2'
        
    - name: Verify dependencies
      run: go mod verify

    - name: Check formatting
      run: if [ -n "$(gofmt -l .)" ]; then echo "Code is not formatted. Run 'go fmt ./...'"; exit 1; fi

    - name: Run go vet
      run: go vet ./...

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        args: --timeout=5m

    - name: Build
      run: go build -v -o ./bin/tge ./cmd/tge

    - name: Run unit tests
      run: go test -v $(go list ./... | grep -v /test/functional)

    - name: Run functional tests
      run: go test -v ./test/functional/...
