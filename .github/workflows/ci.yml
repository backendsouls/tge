name: CI
run-name: "CI [${{ github.event_name == 'pull_request' && 'Merge' || 'Push' }}]: ${{ github.event.pull_request.title || github.event.head_commit.message || github.ref_name }}"

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  prepare:
    name: ${{ github.event_name == 'pull_request' && 'Clone & Merge Simulation' || 'Clone' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

  lint:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.2'
    - name: Verify dependencies
      run: go mod verify
    - name: Check formatting
      run: if [ -n "$(gofmt -l .)" ]; then echo "Code is not formatted. Run 'go fmt ./...'"; exit 1; fi
    - name: Run go vet
      run: go vet ./...
    - name: Run golangci-lint
      run: |
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
        $(go env GOPATH)/bin/golangci-lint run --timeout=5m

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.2'
    - name: Build
      run: go build -v -o ./bin/tge ./cmd/tge

  unit-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.2'
    - name: Run unit tests
      run: go test -v $(go list ./... | grep -v /test/functional)

  functional-test:
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.2'
    - name: Run functional tests
      run: go test -v ./test/functional/...
